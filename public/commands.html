<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nora Legal Commands</title>

    <!-- Office JavaScript API -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>

    <script>
        // Initialize Office
        Office.onReady(function(info) {
            if (info.host === Office.HostType.Word) {
                console.log('Nora Legal commands ready for Word');
            }
        });

        // Quick Draft command - executed from ribbon button
        function quickDraft(event) {
            Word.run(function(context) {
                // Get the current selection
                var selection = context.document.getSelection();

                // Insert placeholder text (in production, this would call AI service)
                selection.insertText(
                    "[Nora Legal: Opening task pane for AI-powered drafting...]",
                    Word.InsertLocation.replace
                );

                return context.sync();
            })
            .then(function() {
                // Open the task pane after inserting text
                Office.addin.showAsTaskpane();
                event.completed();
            })
            .catch(function(error) {
                console.error('Error in quickDraft:', error);
                event.completed();
            });
        }

        // Register the function with Office
        Office.actions = Office.actions || {};
        Office.actions.associate("quickDraft", quickDraft);
    </script>
</head>
<body>
    <!-- This page is used for function commands only, no UI needed -->
</body>
</html>
